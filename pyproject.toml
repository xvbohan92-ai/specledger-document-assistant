[project]
name = "specledger"
version = "0.3.0"
readme = "README.md"
description = "Source-grounded equipment PDF extraction, validation and database review"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1", "pydantic>=2.10,<3", "pdfplumber>=0.11,<1", "pypdfium2>=4.30,<6", "reportlab>=4,<5", "pillow>=11,<14"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.11,<1"]
docling = ["docling>=2.70,<3", "rapidocr>=3,<4", "onnxruntime>=1.19,<2"]
neural = ["torch>=2.6,<3", "transformers>=5.20,<6", "safetensors>=0.8,<1"]
viz = ["matplotlib>=3.9,<4"]

[project.scripts]
specledger = "specledger.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["specledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
